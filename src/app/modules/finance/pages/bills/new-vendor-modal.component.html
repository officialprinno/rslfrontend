<app-modal [open]="open()" title="New Vendor" size="xl" (close)="closed.emit(); reset()">
  <p class="text-sm text-gray-500 -mt-2 mb-5">Register a vendor for accounts payable bills. Only display name is required.</p>

  <div class="space-y-6 max-h-[60vh] overflow-y-auto pr-1">
    <div>
      <h4 class="text-xs font-bold uppercase tracking-wider text-[#1B3A6B] mb-3 pb-2 border-b border-gray-100">Business Identity</h4>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="md:col-span-2">
          <label class="input-label">Display Name <span class="text-red-500">*</span></label>
          <input class="input-field" [(ngModel)]="form.name" placeholder="How this vendor appears on bills" autofocus />
        </div>
        <div>
          <label class="input-label">Company / Registration #</label>
          <input class="input-field" [(ngModel)]="form.registration_number" placeholder="Business registration" />
        </div>
        <div>
          <label class="input-label">TIN / Company ID</label>
          <input class="input-field" [(ngModel)]="form.tin_number" placeholder="Tax identification" />
        </div>
      </div>
    </div>

    <div>
      <h4 class="text-xs font-bold uppercase tracking-wider text-[#1B3A6B] mb-3 pb-2 border-b border-gray-100">Contact</h4>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="input-label">Email</label>
          <input type="email" class="input-field" [(ngModel)]="form.email" placeholder="accounts@vendor.com" />
        </div>
        <div>
          <label class="input-label">Phone</label>
          <input class="input-field" [(ngModel)]="form.phone" placeholder="+255 7XX XXX XXX" />
        </div>
        <div class="md:col-span-2">
          <label class="input-label">Address</label>
          <textarea class="input-field resize-none" rows="2" [(ngModel)]="form.address" placeholder="Street, city, region"></textarea>
        </div>
      </div>
    </div>

    <div>
      <h4 class="text-xs font-bold uppercase tracking-wider text-[#1B3A6B] mb-3 pb-2 border-b border-gray-100">Payment Settings</h4>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="input-label">Currency</label>
          <select class="input-field" [(ngModel)]="form.currency">
            @for (c of currencies(); track c.id) {
              <option [ngValue]="c.id">{{ c.code }} — {{ c.name }}</option>
            }
          </select>
        </div>
        <div>
          <label class="input-label">Payment Terms</label>
          <select class="input-field" [(ngModel)]="form.payment_terms">
            @for (t of paymentTerms; track t.value) {
              <option [value]="t.value">{{ t.label }}</option>
            }
          </select>
        </div>
      </div>
    </div>
  </div>

  <div modalFooter class="flex gap-2 justify-end w-full">
    <button type="button" class="btn-secondary" (click)="closed.emit(); reset()">Cancel</button>
    <button type="button" class="btn-primary min-w-[120px]" [disabled]="saving()" (click)="submit()">
      {{ saving() ? 'Saving…' : 'Save Vendor' }}
    </button>
  </div>
</app-modal>
